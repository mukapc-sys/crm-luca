<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anamnese — Luca Ternes</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#0F2438">
<style>
:root{
  --navy:#0F2438; --navy-3:#1E4062; --ouro:#C9A227;
  --bg:#F4F6F9; --card:#fff; --linha:#E2E7EE;
  --txt:#12202F; --txt-2:#5A6B7D; --erro:#C0392B; --ok:#1E8E5A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
.topo{background:linear-gradient(160deg,var(--navy-3),var(--navy));color:#fff;padding:34px 20px 30px}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}
.logo{width:58px;height:58px;border-radius:15px;background:rgba(201,162,39,.18);
  display:grid;place-items:center;margin-bottom:14px}
.logo img{display:block}
.topo h1{margin:0 0 6px;font-size:25px;letter-spacing:-.02em}
.topo p{margin:0;color:rgba(255,255,255,.75);font-size:15px}
.idioma{display:flex;gap:6px;margin-top:16px}
.idioma button{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);color:#fff;
  border:1px solid transparent;border-radius:9px;padding:7px 13px;font-size:13.5px;cursor:pointer;
  font-family:inherit;line-height:1}
.idioma button:hover{background:rgba(255,255,255,.2)}
.idioma button.on{background:var(--ouro);color:var(--navy);font-weight:650}
.idioma .bandeira{font-size:18px;line-height:1}
.convite{background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.4);border-radius:10px;
  padding:11px 14px;margin-top:16px;font-size:14px;color:#fff}

main{padding:22px 0 60px}
.passo{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:20px;
  margin-bottom:14px;box-shadow:0 1px 3px rgba(16,36,56,.06)}
.passo h2{margin:0 0 3px;font-size:17px}
.passo > p{margin:0 0 16px;color:var(--txt-2);font-size:14px}
label{display:block;font-size:13.5px;font-weight:600;margin:0 0 5px}
.campo{margin-bottom:15px}
.campo small{display:block;color:var(--txt-2);font-size:12.5px;margin-top:4px;font-weight:400}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--linha);
  border-radius:10px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-3);outline-offset:-1px;border-color:transparent}
textarea{min-height:76px;resize:vertical}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opcoes{display:flex;flex-direction:column;gap:8px}
.opcoes label{display:flex;gap:9px;align-items:flex-start;font-weight:400;font-size:15px;
  padding:11px 13px;border:1px solid var(--linha);border-radius:10px;cursor:pointer;margin:0}
.opcoes label:has(input:checked){border-color:var(--navy-3);background:#F4F8FD}
.opcoes input{width:auto;margin-top:3px;flex:none}
.isca{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.barra{position:sticky;bottom:0;background:var(--bg);padding:14px 0 18px;
  border-top:1px solid var(--linha);margin-top:4px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:11px;padding:14px 22px;
  font-size:16px;font-weight:650;cursor:pointer;font-family:inherit;width:100%}
.btn:hover{background:var(--navy-3)}
.btn:disabled{opacity:.55;cursor:default}
.erro{color:var(--erro);font-size:14px;margin-top:10px;text-align:center}
.pronto{text-align:center;padding:50px 20px}
.pronto .marca{width:70px;height:70px;border-radius:50%;background:#E3F3EA;color:var(--ok);
  display:grid;place-items:center;font-size:35px;margin:0 auto 18px}
.pronto h2{margin:0 0 10px;font-size:23px}
.pronto p{color:var(--txt-2);margin:0 auto;max-width:430px}
.cod{display:inline-block;margin-top:20px;background:#EEF3F9;color:var(--navy-3);
  font-family:ui-monospace,Menlo,monospace;font-weight:700;padding:9px 18px;border-radius:9px}
.obrig{color:var(--erro)}
@media(max-width:560px){ .dupla{grid-template-columns:1fr} .topo h1{font-size:22px} }
</style>
</head>
<body>

<div class="topo">
  <div class="wrap">
    <div class="logo"><img src="/img/logo.png" alt="Luca Ternes" width="24" height="44"></div>
    <h1 id="tTitulo">Anamnese — Luca Ternes</h1>
    <p id="tIntro">Preencha com calma. São essas informações que eu uso para montar o seu plano.</p>
    <div class="idioma" id="idiomas"></div>
    <div class="convite" id="convite" hidden></div>
  </div>
</div>

<main class="wrap">
  <form id="form" novalidate>
    <input type="text" name="website" id="isca" class="isca" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="passos"></div>
    <div class="barra">
      <button type="submit" class="btn" id="enviar">Enviar</button>
      <p class="erro" id="erro"></p>
    </div>
  </form>
  <div id="pronto" class="pronto" hidden>
    <div class="marca">✓</div>
    <h2 id="pTitulo">Recebido</h2>
    <p id="pTexto"></p>
    <div class="cod" id="pCod" hidden></div>
  </div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* As perguntas vêm do CRM, nos três idiomas. O Luca edita em Configurações
   e a página muda sozinha — nada aqui precisa ser mexido no código. */
const IDIOMAS = {
  pt: { bandeira: '🇧🇷', nome: 'Português', lang: 'pt-BR' },
  en: { bandeira: '🇺🇸', nome: 'English',   lang: 'en' },
  es: { bandeira: '🇪🇸', nome: 'Español',   lang: 'es' },
};
const T = {
  pt: { enviar: 'Enviar', enviando: 'Enviando…',
    obrigatorio: 'Todas as perguntas são obrigatórias. Faltou responder esta.',
    prontoTitulo: 'Recebido', codigo: 'Seu código: ',
    titulo: 'Anamnese — Luca Ternes',
    intro: 'Preencha com calma. São essas informações que eu uso para montar o seu plano.',
    obrigado: 'Recebi tudo. Te chamo no WhatsApp em breve.',
    ola: (n) => `Olá, ${n}! Esse formulário já está ligado à sua ficha.`,
    paises: ['Brasil', 'Estados Unidos', 'Portugal', 'Inglaterra', 'Canadá', 'Espanha', 'Outro'],
    semPlano: 'Ainda não sei', escolha: 'Escolha uma opção' },
  en: { enviar: 'Submit', enviando: 'Sending…',
    obrigatorio: 'Every question is required. This one is still empty.',
    prontoTitulo: 'All set', codigo: 'Your code: ',
    titulo: 'Health questionnaire — Luca Ternes',
    intro: 'Take your time. This is what I use to build your plan before our call.',
    obrigado: 'Got everything. I will message you on WhatsApp soon.',
    ola: (n) => `Hi ${n}! This form is already linked to your record.`,
    paises: ['United States', 'Brazil', 'Portugal', 'United Kingdom', 'Canada', 'Spain', 'Other'],
    semPlano: 'Not sure yet', escolha: 'Choose one' },
  es: { enviar: 'Enviar', enviando: 'Enviando…',
    obrigatorio: 'Todas las preguntas son obligatorias. Falta responder esta.',
    prontoTitulo: 'Recibido', codigo: 'Tu código: ',
    titulo: 'Anamnesis — Luca Ternes',
    intro: 'Tómate tu tiempo. Esto es lo que uso para armar tu plan antes de la llamada.',
    obrigado: 'Recibí todo. Te escribo por WhatsApp pronto.',
    ola: (n) => `¡Hola, ${n}! Este formulario ya está vinculado a tu ficha.`,
    paises: ['España', 'Estados Unidos', 'Brasil', 'Portugal', 'Reino Unido', 'Canadá', 'Otro'],
    semPlano: 'Todavía no sé', escolha: 'Elige una opción' },
};
const PAIS_INTERNO = {
  'Estados Unidos': 'US', 'United States': 'US', 'Brazil': 'Brasil',
  'United Kingdom': 'Inglaterra', 'Reino Unido': 'Inglaterra', 'Canada': 'Canadá',
  'España': 'Espanha', 'Spain': 'Espanha', 'Other': 'Outro', 'Otro': 'Outro',
};

const navegador = (navigator.language || '').toLowerCase();
let IDIOMA = navegador.startsWith('pt') ? 'pt' : navegador.startsWith('es') ? 'es' : 'en';
let PLANOS = [], TEXTOS = {}, BLOCOS = [], CAMPOS = [], OBJETIVOS = [], CONVIDADO = null;
let DISPONIVEIS = ['pt', 'en', 'es'];
const TOKEN = new URLSearchParams(location.search).get('t') || '';

// cada coisa no idioma pedido, caindo para o português quando não traduziram
const tr = (obj, base) => (obj[`${base}_${IDIOMA}`] || obj[`${base}_pt`] || '').trim();
const opcoesDe = (c) => (tr(c, 'opcoes') || '').split('|').map((x) => x.trim()).filter(Boolean);

function campoHtml(c) {
  const t = T[IDIOMA];
  const rot = tr(c, 'rot'), dica = tr(c, 'dica'), nome = 'c_' + c.chave;
  const req = c.obrigatorio ? ' <span class="obrig">*</span>' : '';
  let corpo = '';
  if (c.tipo === 'longo') corpo = `<textarea id="${nome}"></textarea>`;
  else if (c.tipo === 'hora') corpo = `<input id="${nome}" type="time">`;
  else if (c.tipo === 'data') corpo = `<input id="${nome}" type="date">`;
  else if (c.tipo === 'email') corpo = `<input id="${nome}" type="email" autocomplete="email">`;
  else if (c.tipo === 'tel') corpo = `<input id="${nome}" type="tel" autocomplete="tel">`;
  else if (c.tipo === 'numero') corpo = `<input id="${nome}" type="number" step="any">`;
  else if (c.tipo === 'pais') corpo =
    `<select id="${nome}">${t.paises.map((p) => `<option>${esc(p)}</option>`).join('')}</select>`;
  else if (c.tipo === 'objetivo') corpo =
    `<select id="${nome}"><option value="">${esc(t.escolha)}</option>${
      OBJETIVOS.map((o) => `<option value="${esc(o.nome)}">${esc(tr(o, 'nome') || o.nome)}</option>`).join('')}</select>`;
  else if (c.tipo === 'plano') corpo =
    `<select id="${nome}"><option value="">${esc(t.semPlano)}</option>${
      PLANOS.map((p) => `<option value="${esc(p.codigo)}">${esc(p.nome)}</option>`).join('')}</select>`;
  else if (c.tipo === 'peso') corpo =
    `<div class="dupla"><input id="${nome}" type="number" step="0.1" placeholder="kg">
       <input id="${nome}_lb" type="number" step="0.1" placeholder="lb"></div>`;
  else if (c.tipo === 'altura') corpo =
    `<div class="dupla"><input id="${nome}" type="number" step="0.1" placeholder="cm">
       <div class="dupla" style="gap:8px">
         <input id="${nome}_ft" type="number" step="1" placeholder="ft">
         <input id="${nome}_in" type="number" step="0.1" placeholder="in"></div></div>`;
  else if (c.tipo === 'radio' || c.tipo === 'select') {
    const ops = opcoesDe(c);
    corpo = c.tipo === 'select'
      ? `<select id="${nome}"><option value="">${esc(t.escolha)}</option>${
          ops.map((o) => `<option>${esc(o)}</option>`).join('')}</select>`
      : `<div class="opcoes">${ops.map((o) => `<label>
          <input type="radio" name="${nome}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`;
  } else corpo = `<input id="${nome}" type="text">`;

  return `<div class="campo" data-id="${esc(c.chave)}" data-tipo="${esc(c.tipo)}" data-obrig="${c.obrigatorio}">
    <label for="${nome}">${esc(rot)}${req}</label>${corpo}${dica ? `<small>${esc(dica)}</small>` : ''}</div>`;
}

function montar() {
  const t = T[IDIOMA];
  document.documentElement.lang = IDIOMAS[IDIOMA].lang;
  const sufixo = IDIOMA === 'pt' ? '' : '_' + IDIOMA;
  $('#tTitulo').textContent = TEXTOS['form_titulo' + sufixo] || t.titulo;
  $('#tIntro').textContent = TEXTOS['form_intro' + sufixo] || t.intro;
  $('#enviar').textContent = t.enviar;

  $('#idiomas').innerHTML = DISPONIVEIS.filter((i) => IDIOMAS[i]).map((i) => `
    <button type="button" data-idioma="${i}"${i === IDIOMA ? ' class="on"' : ''}>
      <span class="bandeira">${IDIOMAS[i].bandeira}</span>${IDIOMAS[i].nome}</button>`).join('');
  $$idiomas();

  const convite = $('#convite');
  if (CONVIDADO && CONVIDADO.nome) {
    convite.hidden = false;
    convite.textContent = t.ola(String(CONVIDADO.nome).trim().split(/\s+/)[0]);
  } else convite.hidden = true;

  $('#passos').innerHTML = BLOCOS.map((b) => {
    const meus = CAMPOS.filter((c) => c.bloco_chave === b.chave);
    if (!meus.length) return '';
    return `<section class="passo"><h2>${esc(tr(b, 'titulo'))}</h2>
      ${tr(b, 'ajuda') ? `<p>${esc(tr(b, 'ajuda'))}</p>` : ''}
      ${meus.map(campoHtml).join('')}</section>`;
  }).join('');

  ligarConversores();
  preencherConvidado();
}

function $$idiomas() {
  document.querySelectorAll('#idiomas button').forEach((b) => {
    b.onclick = () => { IDIOMA = b.dataset.idioma; montar(); };
  });
}

// quem recebeu o link já cadastrado não redigita o que o Luca já tem
function preencherConvidado() {
  if (!CONVIDADO) return;
  const por = { nome: CONVIDADO.nome, email: CONVIDADO.email,
    telefone: CONVIDADO.telefone, cidade: CONVIDADO.cidade };
  Object.entries(por).forEach(([k, v]) => {
    const e = $('#c_' + k);
    if (e && v && !e.value) e.value = v;
  });
  const pais = $('#c_pais');
  if (pais && CONVIDADO.pais) {
    const alvo = [...pais.options].find((o) =>
      o.value === CONVIDADO.pais || (PAIS_INTERNO[o.value] || o.value) === CONVIDADO.pais);
    if (alvo) pais.value = alvo.value;
  }
}

// kg ↔ lb e cm ↔ pés/polegadas, porque ele atende nos dois sistemas
function ligarConversores() {
  const KG = 0.45359237;
  CAMPOS.filter((c) => c.tipo === 'peso').forEach((c) => {
    const kg = $('#c_' + c.chave), lb = $('#c_' + c.chave + '_lb');
    if (!kg || !lb) return;
    kg.oninput = () => { lb.value = kg.value ? (+kg.value / KG).toFixed(1) : ''; };
    lb.oninput = () => { kg.value = lb.value ? (+lb.value * KG).toFixed(1) : ''; };
  });
  CAMPOS.filter((c) => c.tipo === 'altura').forEach((c) => {
    const cm = $('#c_' + c.chave), ft = $('#c_' + c.chave + '_ft'), pol = $('#c_' + c.chave + '_in');
    if (!cm || !ft || !pol) return;
    cm.oninput = () => {
      if (!cm.value) { ft.value = ''; pol.value = ''; return; }
      const tot = +cm.value / 2.54;
      ft.value = Math.floor(tot / 12); pol.value = (tot - Math.floor(tot / 12) * 12).toFixed(1);
    };
    const daImperial = () => {
      const f = +ft.value || 0, i = +pol.value || 0;
      cm.value = (f || i) ? ((f * 12 + i) * 2.54).toFixed(1) : '';
    };
    ft.oninput = daImperial; pol.oninput = daImperial;
  });
}

function valor(chave, tipo) {
  if (tipo === 'radio') {
    const m = document.querySelector(`input[name="c_${chave}"]:checked`);
    return m ? m.value : '';
  }
  const e = $('#c_' + chave);
  return e ? e.value.trim() : '';
}

const SEXO_M = ['masculino', 'male', 'homem', 'm'];

$('#form').onsubmit = async (ev) => {
  ev.preventDefault();
  const t = T[IDIOMA];
  const btn = $('#enviar'), err = $('#erro');
  err.textContent = '';

  const respostas = {}; let faltando = null;
  for (const c of CAMPOS) {
    const v = valor(c.chave, c.tipo);
    if (c.obrigatorio && !v && !faltando) faltando = c.chave;
    if (v) respostas[tr(c, 'rot')] = v;
  }
  if (faltando) {
    err.textContent = t.obrigatorio;
    const alvo = document.querySelector(`[data-id="${faltando}"]`);
    if (alvo) {
      alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const inp = alvo.querySelector('input,select,textarea');
      if (inp) inp.focus();
    }
    return;
  }

  const paisRot = valor('pais', 'pais');
  const sexoRot = valor('sexo', 'radio') || valor('sexo', 'select');
  const corpo = {
    idioma: IDIOMA, website: $('#isca').value, token: TOKEN,
    nome: valor('nome', 'texto'), email: valor('email', 'email'), telefone: valor('telefone', 'tel'),
    pais: PAIS_INTERNO[paisRot] || paisRot, cidade: valor('cidade', 'texto'),
    instagram: valor('instagram', 'texto'), nascimento: valor('nascimento', 'data'),
    profissao: valor('profissao', 'texto'),
    sexo: SEXO_M.includes(sexoRot.toLowerCase()) ? 'M' : sexoRot ? 'F' : '',
    objetivo: valor('objetivo', 'objetivo'), plano_codigo: valor('plano_codigo', 'plano'),
    peso_kg: valor('peso_kg', 'peso'), altura_cm: valor('altura_cm', 'altura'),
    indicacao: valor('indicacao', 'texto'), origem: 'Formulário',
    respostas,
  };

  btn.disabled = true; btn.textContent = t.enviando;
  try {
    const r = await fetch('/api/publico/anamnese', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'erro');
    $('#form').hidden = true;
    $('#pronto').hidden = false;
    $('#pTitulo').textContent = t.prontoTitulo;
    const sufixo = IDIOMA === 'pt' ? '' : '_' + IDIOMA;
    $('#pTexto').textContent = TEXTOS['form_agradecimento' + sufixo] || t.obrigado;
    if (j.cod) { $('#pCod').hidden = false; $('#pCod').textContent = t.codigo + j.cod; }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    err.textContent = e.message; btn.disabled = false; btn.textContent = t.enviar;
  }
};

(async () => {
  try {
    const c = await fetch('/api/publico/config' + (TOKEN ? '?t=' + encodeURIComponent(TOKEN) : ''))
      .then((r) => r.json());
    PLANOS = c.planos || []; TEXTOS = c.textos || {};
    BLOCOS = c.blocos || []; CAMPOS = c.campos || [];
    OBJETIVOS = c.objetivos || []; CONVIDADO = c.convidado || null;
    if (c.idiomas && c.idiomas.length) DISPONIVEIS = c.idiomas;
  } catch {
    $('#erro').textContent = 'Não consegui carregar o formulário. Recarregue a página.';
  }
  if (!DISPONIVEIS.includes(IDIOMA)) IDIOMA = DISPONIVEIS[0] || 'pt';
  montar();
})();
</script>
</body>
</html>
