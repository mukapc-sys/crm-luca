<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM — Luca Ternes</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/icon-16.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="theme-color" content="#0F2438">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --navy:#0F2438; --navy-2:#173350; --navy-3:#1E4062;
  --ouro:#C9A227; --ouro-claro:#E4C25C;
  --bg:#F4F6F9; --card:#fff; --linha:#E2E7EE;
  --txt:#12202F; --txt-2:#5A6B7D;
  --ok:#1E8E5A; --alerta:#C77700; --erro:#C0392B;
  --r:12px; --sombra:0 1px 3px rgba(16,36,56,.08),0 8px 24px rgba(16,36,56,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;font-size:15px}
h1,h2,h3{margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
a{color:var(--navy-3)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--linha);
  border-radius:9px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-3);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:62px}
label{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin:0 0 4px}
.hide{display:none!important}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(900px 500px at 50% -10%,var(--navy-3),var(--navy)) ,var(--navy);padding:20px}
.login-box{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:30px 26px;box-shadow:var(--sombra)}
.logo{width:64px;height:64px;border-radius:16px;background:var(--navy);
  display:grid;place-items:center;margin:0 auto 14px}
.logo img{display:block}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.marca div:first-child{width:38px;height:38px;border-radius:10px;background:rgba(201,162,39,.16);
  display:grid;place-items:center;flex:none}
.marca img{display:block}
.marca b{display:block;font-size:14px}
.marca span{font-size:11px;color:rgba(255,255,255,.55)}
nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  color:rgba(255,255,255,.76);padding:10px 12px;border-radius:9px;font-size:14px;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button.on{background:var(--ouro);color:var(--navy);font-weight:650}
nav button .bd{margin-left:auto;background:var(--erro);color:#fff;border-radius:99px;
  font-size:11px;font-weight:700;padding:1px 7px}
nav button.on .bd{background:var(--navy);color:#fff}
main{padding:22px 26px 60px;max-width:1280px}
.topo{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topo p{margin:2px 0 0;color:var(--txt-2);font-size:13px}
.topo .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  padding:16px;box-shadow:var(--sombra)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:600;font-size:14px}
.btn:hover{background:var(--navy-3)}
.btn.ouro{background:var(--ouro);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--linha)}
.btn.zap{background:#20a45a;color:#fff}
.btn.mini{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.perigo{background:#fff;color:var(--erro);border:1px solid #f0c8c3}
.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.kpi span{font-size:12px;color:var(--txt-2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
  background:#EDF1F6;color:var(--txt-2);white-space:nowrap}
.tag.ativo{background:#E3F3EA;color:var(--ok)}
.tag.devendo{background:#FCECE9;color:var(--erro)}
.tag.encerrado{background:#EDF1F6;color:var(--txt-2)}
.tag.parceria{background:#FBF0D6;color:#8A6D12}
.tag.lead{background:#E6EEF8;color:var(--navy-3)}
.tag.atrasada{background:#FCECE9;color:var(--erro)}
.tag.hoje{background:#FDF0DC;color:var(--alerta)}
.tag.proxima{background:#EDF1F6;color:var(--txt-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-2);
  padding:9px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFE}
.cod{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:700;color:var(--navy-3);
  background:#EEF3F9;padding:2px 7px;border-radius:6px}
.apelido{color:var(--ouro);font-size:12.5px;font-style:italic}
.vazio{text-align:center;color:var(--txt-2);padding:30px 14px;font-size:14px}
.linha-aviso{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}
.linha-aviso:last-child{border-bottom:0}
.linha-aviso .txt{flex:1;min-width:0}
.linha-aviso .txt b{display:block;font-size:14px}
.linha-aviso .txt small{color:var(--txt-2);font-size:12.5px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(12,24,38,.5);display:grid;place-items:center;
  padding:18px;z-index:100;overflow:auto}   /* acima das tarefas, que são 80 */
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:92vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal-topo{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid var(--linha);
  display:flex;align-items:center;gap:10px;z-index:2}
.modal-topo h3{flex:1}
.modal-corpo{padding:18px 20px}
.modal-pe{position:sticky;bottom:0;background:#fff;padding:13px 20px;border-top:1px solid var(--linha);
  display:flex;gap:8px;justify-content:flex-end}
.x{background:none;border:0;font-size:22px;color:var(--txt-2);line-height:1;padding:0 4px}

/* ---------- ficha de consulta (caderno) ---------- */
.caderno{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:18px}
.caderno .cab{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding-bottom:12px;
  border-bottom:2px solid var(--navy);margin-bottom:6px}
.refeicao{border-bottom:1px solid var(--linha);padding:12px 0}
.refeicao .rot{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.refeicao .rot b{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);
  border-left:3px solid var(--ouro);padding-left:8px}
.refeicao .rot input[type=time]{width:110px;flex:none}
.abas{display:flex;gap:6px;border-bottom:1px solid var(--linha);margin-bottom:14px;overflow-x:auto}
.abas button{background:none;border:0;padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--txt-2);
  border-bottom:2px solid transparent;white-space:nowrap}
.abas button.on{color:var(--navy);border-bottom-color:var(--ouro)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros > div{min-width:150px}
.filtros .busca{flex:1;min-width:220px}
.barra-peso{height:6px;background:var(--linha);border-radius:99px;overflow:hidden;margin-top:6px}
.barra-peso i{display:block;height:100%;background:var(--ouro)}
/* ---------- gráficos ---------- */
.viz{width:100%;height:auto;display:block;overflow:visible}
.viz-col rect:first-of-type{cursor:default}
.viz-col:hover rect:nth-of-type(2){fill:var(--ouro)}
.viz-barras{display:flex;flex-direction:column;gap:9px}
.viz-linha{display:grid;grid-template-columns:minmax(78px,26%) 1fr auto;gap:10px;align-items:center}
.viz-rot{font-size:12.5px;color:var(--txt-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viz-trilho{height:12px;background:#EEF2F7;border-radius:4px;overflow:hidden}
.viz-trilho i{display:block;height:100%;border-radius:0 4px 4px 0}
.viz-val{font-size:12.5px;font-weight:650;white-space:nowrap}
.relogios .viz-linha{grid-template-columns:minmax(150px,42%) 1fr auto}
@media(max-width:620px){
  .viz-linha{grid-template-columns:1fr auto;gap:4px 10px}
  .viz-trilho{grid-column:1/-1}
}


/* ---------- as três pesagens da ficha ---------- */
.pesos{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;align-items:start;margin:12px 0 0}
.pesos > div > span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--txt-2);font-weight:700;margin-bottom:4px}
.pes-ref{background:#F6F8FB;border:1px solid var(--linha);border-radius:10px;padding:10px 12px}
.pes-ref b{display:block;font-size:19px;letter-spacing:-.02em}
.pes-ref small{display:block;font-size:12px;color:var(--txt-2);margin-top:2px}
.pes-hoje{padding:10px 0 0}
.pes-linha{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0 14px;
  font-size:13px;min-height:19px}
.pes-nada{color:var(--txt-2)}
/* a cor separa subir de baixar; a seta e a palavra é que dizem o que houve */
.dif{display:inline-flex;align-items:baseline;gap:5px;color:var(--txt-2)}
.dif b{font-size:14.5px}
.dif i{font-style:normal;font-weight:600}
.dif.baixou{color:#117A5B}
.dif.subiu{color:#A3561B}
.dif.igual{color:var(--txt-2)}
@media(max-width:700px){.pesos{grid-template-columns:1fr 1fr}.pes-hoje{grid-column:1/-1}}

/* ---------- refeições e TMB na ficha ---------- */
.refeicao .rot .refNome{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--navy);border:0;border-left:3px solid var(--ouro);border-radius:0;padding:2px 8px;
  background:none;flex:1;min-width:0}
.refeicao .rot .refNome:focus{outline:2px solid var(--navy-3);outline-offset:1px;border-radius:5px}
.refeicao .rot .refHora{width:112px;flex:none}
.refeicao .rot .refTirar{flex:none;color:var(--txt-2);padding:4px 9px;line-height:1}
.refeicao .rot .refTirar:hover{color:var(--erro);border-color:var(--erro)}
/* treino fica com a borda escura: ele enxerga de relance onde está no dia */
.refeicao.e-treino .rot .refNome{border-left-color:var(--navy-3)}
.refeicao .ord-pega{flex:none;cursor:grab;color:#B6C2CF;font-size:13px;letter-spacing:-3px;
  padding:4px 3px 4px 0;user-select:none;touch-action:none}
.refeicao .ord-pega:hover{color:var(--navy-3)}
.refeicao.ord-mov{opacity:.6;background:#F2F6FB;border-radius:8px}
.refeicao.ord-mov .ord-pega{cursor:grabbing}
#refLista.ord-ativo textarea,#refLista.ord-ativo input{pointer-events:none}
.kpi-tmb{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#F6F8FB;
  border:1px solid var(--linha);border-radius:10px;padding:13px 15px}
.kpi-tmb > div span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--txt-2);font-weight:700;margin-bottom:3px}
.kpi-tmb > div b{font-size:21px;letter-spacing:-.02em}
.kpi-tmb .obs{grid-column:1/-1;font-size:12.5px;color:var(--txt-2);border-top:1px solid var(--linha);
  padding-top:9px}
.kpi-tmb .obs span{text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--txt-2)}
.kpi-tmb .obs b{font-size:12.5px;color:var(--txt)}
.kpi-tmb.incompleto{background:#FDF6E6;border-color:#E6D6A8}
/* saldo calórico: déficit e superávit não são bom nem ruim por si — quem diz
   isso é o objetivo. Por isso seta + palavra, e cor só para separar os dois. */
.saldo{background:#F6F8FB;border:1px solid var(--linha);border-radius:10px;padding:11px 14px;
  display:flex;flex-direction:column;justify-content:center}
.saldo > span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--txt-2);font-weight:700;margin-bottom:3px}
.saldo > b{font-size:18px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.saldo > b i{font-style:normal;font-size:14px}
.saldo > small{display:block;font-size:12px;color:var(--txt-2);margin-top:3px;line-height:1.4}
.saldo[data-tipo="deficit"]{background:#EEF4FB;border-color:#CBDCF0}
.saldo[data-tipo="deficit"] > b{color:#1E4062}
.saldo[data-tipo="superavit"]{background:#FDF4E6;border-color:#EFD9AE}
.saldo[data-tipo="superavit"] > b{color:#8A5A00}
.saldo[data-tipo="manutencao"] > b{color:var(--txt)}
/* dentro do bloco de TMB o saldo é uma célula a mais, não uma caixa dentro de
   outra: fica só a listra lateral para separar os dois casos */
.kpi-tmb .saldo{background:none;border:0;border-left:3px solid var(--linha);
  border-radius:0;padding:0 0 0 11px}
.kpi-tmb .saldo[data-tipo="deficit"]{border-left-color:#1E4062}
.kpi-tmb .saldo[data-tipo="superavit"]{border-left-color:#C77700}

/* ---------- cabeçalho do InBody na ficha ---------- */
.inbody-cab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#F6F8FB;
  border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
.inbody-cab label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-2);
  font-weight:700;margin:0 0 2px}
.inbody-cab > div > div{font-size:14px;font-weight:600}
@media(max-width:700px){.inbody-cab{grid-template-columns:repeat(2,1fr)}.kpi-tmb{grid-template-columns:1fr}}

.aviso-banco{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:#FBF0D6;border:1px solid #E6D6A8;color:#7A5F0D;border-radius:10px;
  padding:12px 15px;margin-bottom:16px;font-size:13.5px;line-height:1.5}
.aviso-banco > div{flex:1;min-width:240px}
.aviso-banco .btn{flex:none}

/* ---------- olho: esconde os números na frente dos outros ---------- */
body.sigilo .sigiloso{filter:blur(7px);user-select:none;transition:filter .12s}
body.sigilo .sigiloso:hover{filter:blur(3px)}
#olho.on{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}

/* ---------- lembrete de compromisso ----------
   Fica por cima de tudo, inclusive de um modal aberto, e não fecha no Esc
   nem clicando fora: só sai no ciente ou adiando. */
.lembrete{position:fixed;inset:0;z-index:300;background:rgba(10,22,36,.62);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .18s}
.lembrete.entrou{opacity:1}
.lb-caixa{background:#fff;border-radius:16px;max-width:430px;width:100%;padding:26px 26px 20px;
  text-align:center;box-shadow:0 26px 70px rgba(0,0,0,.4);
  transform:scale(.94);transition:transform .22s cubic-bezier(.2,.8,.25,1)}
.lembrete.entrou .lb-caixa{transform:none}
.lb-sino{font-size:40px;line-height:1;animation:lbToca 1.1s ease-in-out infinite}
@keyframes lbToca{0%,70%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}
  20%{transform:rotate(-12deg)}30%{transform:rotate(9deg)}40%{transform:rotate(-6deg)}}
.lb-quando{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ouro);margin:12px 0 2px}
.lb-caixa h2{font-size:21px;line-height:1.25;margin:0 0 8px}
.lb-info{font-size:13.5px;color:var(--txt-2);margin:0 0 4px}
.lb-obs{font-size:13px;color:var(--txt);background:#F6F8FB;border-radius:9px;
  padding:9px 12px;margin:10px 0 0;text-align:left;white-space:pre-wrap}
.lb-botoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.lb-ficha{background:none;border:0;color:var(--navy-3);font-size:13px;font-weight:600;
  margin-top:12px;text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){.lb-sino{animation:none}}

/* de onde vem a linha do Início: funil de venda ou agenda */
.de-onde{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;padding:2px 6px;border-radius:5px;vertical-align:1px;margin-right:4px}
.de-onde.venda{background:#EFE6C8;color:#6E5410}
.de-onde.agenda{background:#E6EDF6;color:#2A4A6B}

/* ---------- agenda ----------
   Uma grade só para cabeçalho e dias: com duas grades irmãs, bastava um
   título comprido esticar uma coluna para o "QUI" parar em cima de quarta.
   minmax(0,1fr) é o que impede a coluna de crescer com o conteúdo. */
.ag-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;
  align-items:stretch}
.ag-cab{position:sticky;top:0;z-index:5;background:var(--bg);
  font-size:11px;font-weight:700;color:var(--txt-2);text-transform:uppercase;
  letter-spacing:.07em;padding:7px 10px 8px;border-bottom:2px solid var(--linha)}
.ag-cab.hoje{color:var(--ouro);border-bottom-color:var(--ouro)}
.ag-dia{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);
  padding:7px 8px 8px;min-height:104px;min-width:0;overflow:hidden}
.ag-dia.fds{background:#FAFBFD}
.ag-dia.hoje{border-color:var(--ouro);border-width:2px;padding:6px 7px 7px}
/* o vazio fica como fantasma: a semana se lê inteira, sem buraco no meio */
.ag-vazio{border:1px dashed #E6EBF1;border-radius:var(--r);min-height:104px;min-width:0}
.ag-num{display:flex;align-items:baseline;gap:5px;font-size:12px;font-weight:700;
  color:var(--txt-2);margin-bottom:5px}
.ag-dia.hoje .ag-num{color:var(--ouro)}
/* o dia da semana dentro da célula só no celular, onde o cabeçalho some;
   no desktop ele está logo acima e repetir é ruído */
.ag-num small{display:none;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:#A8B4C0}
.ag-dia.hoje .ag-num small{color:var(--ouro)}
.ag-ev{cursor:pointer;font-size:11.5px;border-left:3px solid;padding:3px 6px;border-radius:5px;
  margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-insta{display:block;font-size:11px;color:var(--navy-3);text-decoration:none;
  padding:0 6px 3px 12px;margin:-2px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-insta:hover{text-decoration:underline}
@media(max-width:820px){
  .ag-grade{grid-template-columns:1fr;gap:6px}
  .ag-cab,.ag-vazio{display:none}      /* numa coluna só, o cabeçalho não ajuda */
  .ag-num small{display:inline}
  .ag-dia{min-height:0}
  .ag-ev{white-space:normal}            /* sobra largura: melhor ler inteiro */
}

/* ---------- card que abre o detalhe ---------- */
.kpi.clicavel{cursor:pointer;position:relative;transition:border-color .12s,box-shadow .12s,transform .12s}
.kpi.clicavel:hover,.kpi.clicavel:focus-visible{border-color:var(--ouro);
  box-shadow:0 6px 18px rgba(16,36,56,.10);transform:translateY(-1px);outline:none}
.kpi.clicavel::after{content:'⌕';position:absolute;top:10px;right:12px;font-size:15px;
  color:var(--txt-2);opacity:.45;transition:opacity .12s}
.kpi.clicavel:hover::after,.kpi.clicavel:focus-visible::after{opacity:1;color:var(--ouro)}
.det-lista{max-height:min(58vh,460px);overflow:auto;border:1px solid var(--linha);border-radius:10px}
.det-lista table{width:100%}
.det-lista thead th{position:sticky;top:0;background:var(--card);z-index:1}

/* ---------- escolher paciente digitando ---------- */
.bp{position:relative}
.bp-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;
  color:var(--txt-2);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:5px}
.bp-x:hover{background:#EDF1F6;color:var(--erro)}
.bp-lista{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--card);
  border:1px solid var(--linha);border-radius:10px;box-shadow:0 14px 34px rgba(16,36,56,.18);
  max-height:260px;overflow:auto}
.bp-item{padding:8px 11px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--linha)}
.bp-item:last-child{border-bottom:none}
.bp-item:hover,.bp-item.on{background:#F2F6FB}
.bp-vazio{padding:10px 11px;font-size:13px;color:var(--txt-2)}

/* ---------- fichas de formulário sem dono ---------- */
.aviso-leve{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:#EEF4FB;border:1px solid #D2E0F0;color:#2A4A6B;border-radius:10px;
  padding:11px 14px;margin-bottom:14px;font-size:13px;line-height:1.5}
.aviso-leve > span{flex:1;min-width:240px}
.dica{color:#5A6B7C;font-size:13px;line-height:1.5;margin:0 0 12px}
.sd-lista{max-height:min(56vh,440px);overflow:auto;border:1px solid var(--linha);
  border-radius:10px}
.sd-item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 12px;border-bottom:1px solid var(--linha)}
.sd-item:last-child{border-bottom:none}
.sd-item > div:first-child{flex:1;min-width:200px}
.sd-item small{display:block;color:#6B7A89;font-size:12px;margin-top:2px}
.sd-acao{display:flex;gap:6px;align-items:center}
.sd-acao select{max-width:210px}

/* ---------- tarefas flutuantes ---------- */
#tarefas{position:fixed;right:20px;bottom:20px;width:330px;z-index:80;background:#FFF8D6;
  border:1px solid #E8D98A;border-radius:12px;box-shadow:0 14px 36px rgba(16,36,56,.22);
  display:flex;flex-direction:column;overflow:hidden;max-height:min(560px,calc(100vh - 40px))}
#tarefas.arrastando{box-shadow:0 22px 50px rgba(16,36,56,.34);cursor:grabbing;user-select:none}
#tarefas .tf-cab{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#F7EDB8;
  border-bottom:1px solid #E8D98A;cursor:grab;user-select:none;flex:none}
#tarefas.arrastando .tf-cab{cursor:grabbing}
#tarefas .tf-cab b{font-size:13px;color:#6B5A10;flex:none}
#tarefas .tf-cab small{font-size:11.5px;color:#8A7620;flex:1;text-align:right}
#tarefas .tf-cab small .urgente{color:#9A3412}
#tarefas .tf-cab button{background:none;border:0;font-size:15px;line-height:1;color:#6B5A10;
  padding:2px 5px;border-radius:5px;flex:none}
#tarefas .tf-cab button:hover{background:rgba(0,0,0,.07)}
#tarefas .tf-nova{display:flex;gap:6px;padding:10px 10px 8px;border-bottom:1px solid #EFE2A8;flex:none}
#tarefas .tf-nova input[type=text]{flex:1;min-width:0;border:1px solid #E8D98A;background:#fff;
  border-radius:8px;padding:8px 10px;font-size:13.5px}
#tarefas .tf-nova button{flex:none;border:1px solid #E8D98A;background:#fff;color:#6B5A10;
  border-radius:8px;padding:6px 10px;font-size:13.5px;line-height:1}
#tarefas .tf-nova button:hover{background:#FFFDF2}
#tarefas .tf-nova button.on{background:#6B5A10;color:#fff;border-color:#6B5A10}
#tfQuandoCampos{display:flex;gap:6px;padding:0 10px 9px;border-bottom:1px solid #EFE2A8;flex:none}
#tfQuandoCampos input{flex:1;min-width:0;border:1px solid #E8D98A;background:#fff;border-radius:8px;
  padding:6px 8px;font-size:12.5px}
#tarefas .tf-corpo{overflow:auto;flex:1}
#tarefas ul{list-style:none;margin:0;padding:4px 0}
.tf-item{display:flex;align-items:flex-start;gap:9px;padding:7px 11px;transition:opacity .2s}
.tf-item + .tf-item{border-top:1px solid #F2E7B9}
.tf-check{flex:none;width:19px;height:19px;margin-top:1px;border:1.5px solid #B59C2E;background:#fff;
  border-radius:50%;color:#fff;font-size:11px;line-height:1;padding:0;display:grid;place-items:center}
.tf-check:hover{border-color:#6B5A10;background:#FFFDF2}
.tf-item.feita .tf-check{background:#6B5A10;border-color:#6B5A10}
.tf-txt{flex:1;min-width:0;font-size:13.5px;line-height:1.4;color:#3D3306}
.tf-txt > span{cursor:text;display:block;word-break:break-word}
.tf-txt > span:hover{text-decoration:underline;text-decoration-style:dotted}
.tf-quando{display:inline-block;margin-top:3px;font-size:11.5px;color:#8A7620;
  background:rgba(255,255,255,.75);border-radius:5px;padding:1px 6px}
.tf-quando.hoje{color:#8A5A00;background:#FDF0DC;font-weight:650}
.tf-quando.atrasado{color:#93261A;background:#FCECE9;font-weight:650}
.tf-x{flex:none;background:none;border:0;color:#B59C2E;font-size:16px;line-height:1;padding:0 3px;
  opacity:0;transition:opacity .15s}
.tf-item:hover .tf-x{opacity:1}
.tf-x:hover{color:var(--erro)}
.tf-item.feita .tf-txt{color:#8A7620}
.tf-item.feita .tf-txt > span{text-decoration:line-through}
.tf-item.riscando .tf-txt > span{text-decoration:line-through;transition:opacity .3s}
.tf-item.riscando{opacity:.35}
.tf-vazio{padding:14px 12px;font-size:13px;color:#8A7620;text-align:center}
.tf-feitas-cab{display:flex;align-items:center;gap:7px;padding:8px 11px;border-top:1px solid #E8D98A;
  background:rgba(255,255,255,.4);font-size:12.5px;color:#6B5A10;font-weight:650;cursor:pointer;
  user-select:none}
.tf-feitas-cab .seta{font-size:10px}
.tf-feitas-cab .qtd{margin-left:auto;font-weight:400;color:#8A7620}
#tfPorData{display:block;width:calc(100% - 20px);margin:2px 10px 8px;border:1px dashed #E8D98A;
  background:none;color:#8A6D12;font-size:12px;font-weight:600;padding:5px;border-radius:7px;
  cursor:pointer}
#tfPorData:hover{background:#FFFBE8}
#tarefas.min #tfPorData{display:none}
.tf-item .ord-pega{flex:none;cursor:grab;color:#C6B87A;font-size:12px;letter-spacing:-3px;
  padding:3px 2px 3px 0;user-select:none;touch-action:none;align-self:flex-start;margin-top:3px}
.tf-item .ord-pega:hover{color:#8A6D12}
.tf-item.ord-mov{opacity:.65;background:#FFF2B8;border-radius:7px}
.tf-item.ord-mov .ord-pega{cursor:grabbing}
#tfLista.ord-ativo .tf-txt,#tfLista.ord-ativo button{pointer-events:none}
#tfLimpar{display:block;width:calc(100% - 20px);margin:6px 10px 10px;border:1px solid #E8D98A;
  background:#fff;color:#8A7620;border-radius:8px;padding:6px;font-size:12.5px}
#tfLimpar:hover{color:var(--erro);border-color:var(--erro)}
#tarefas.min{width:auto;max-height:none}
#tarefas.min .tf-nova,#tarefas.min #tfQuandoCampos,#tarefas.min .tf-corpo,
#tarefas.min .tf-feitas-cab,#tarefas.min #tfLimpar{display:none}
#tarefas.min .tf-cab{border-bottom:0}
#tarefas.cheio.min .tf-cab{background:var(--ouro)}
body.apresentando #tarefas{display:none}
@media(max-width:860px){#tarefas{right:10px;bottom:10px;width:min(330px,calc(100vw - 20px))}}
@media print{#tarefas{display:none}}

/* ---------- InBody: a tela que ele vira para o paciente ---------- */
body.apresentando{overflow:hidden}
.ib-show{position:fixed;inset:0;z-index:200;background:rgba(10,22,36,.82);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  display:grid;place-items:center;overflow:auto;padding:clamp(10px,2vh,24px) 18px;
  opacity:0;transition:opacity .26s ease}
.ib-show.entrou{opacity:1}
.ib-sair{position:fixed;top:16px;right:18px;z-index:3;background:rgba(255,255,255,.14);color:#fff;
  border:0;width:40px;height:40px;border-radius:50%;font-size:17px;line-height:1}
.ib-sair:hover{background:rgba(255,255,255,.28)}
.ib-imprimir{position:fixed;top:16px;right:68px;z-index:3;background:rgba(255,255,255,.14);
  color:#fff;border:0;height:40px;padding:0 16px;border-radius:99px;font-size:13.5px;font-weight:600}
.ib-imprimir:hover{background:rgba(255,255,255,.28)}
.ib-pagina{width:min(1280px,100%);background:#fff;border-radius:14px;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.5);transform:scale(.965) translateY(14px);
  transition:transform .32s cubic-bezier(.2,.8,.25,1)}
.ib-show.entrou .ib-pagina{transform:none}
.ib-topo{display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#17355A,#0B1B2C);padding:16px 26px}
.ib-marca{display:flex;align-items:center;gap:11px;color:#fff;letter-spacing:.16em;
  font-size:16px;font-weight:600}
.ib-marca i{color:var(--ouro);font-style:normal;margin:0 2px}
.ib-selo{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff}
.ib-selo::first-letter{color:#E8A0B4}
.ib-faixa{height:7px;background:linear-gradient(90deg,#C9A227,#9C7C14)}
.ib-cab{display:grid;grid-template-columns:1.8fr repeat(7,1fr);gap:1px;background:var(--linha);
  border-bottom:1px solid var(--linha)}
.ib-cab > div{background:#fff;padding:11px 14px;min-width:0}
.ib-cab label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--txt-2);font-weight:700;margin-bottom:3px}
.ib-cab b{font-size:14.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib-corpo{padding:10px 26px 4px}
.ib-linha,.ib-datas{display:grid;grid-template-columns:230px 1fr 300px;gap:18px;align-items:center;
  padding:clamp(5px,1.1vh,12px) 0;border-bottom:1px solid var(--linha);
  opacity:0;transform:translateY(16px);animation:ibSobe .5s ease forwards;animation-delay:var(--atraso)}
.ib-datas{border-bottom:0;padding-top:0;align-items:start}
@keyframes ibSobe{to{opacity:1;transform:none}}
.ib-rot h3{font-size:15px;margin:0 0 4px;line-height:1.3}
.ib-rot h3 span{font-weight:500;color:var(--txt-2)}
.ib-agora{font-size:clamp(22px,2.9vh,30px);font-weight:750;letter-spacing:-.025em;
  line-height:1.05;color:var(--navy)}
.ib-agora i{font-style:normal;font-size:14px;font-weight:600;color:var(--txt-2);margin-left:3px}
.ib-delta{font-size:13.5px;font-weight:700;margin-top:3px}
.ib-delta small{display:block;font-weight:500;font-size:11.5px;color:var(--txt-2)}
.ib-grafico{min-width:0}
.ib-grafico svg{width:100%;height:clamp(72px,11.2vh,132px);display:block;overflow:visible}
.ib-traco{stroke-dasharray:2400;stroke-dashoffset:2400;animation:ibrisca 1.5s ease forwards;
  animation-delay:calc(var(--atraso) + .18s)}
@keyframes ibrisca{to{stroke-dashoffset:0}}
.ib-ponto{opacity:0;animation:ibPonto .3s ease forwards;
  animation-delay:calc(var(--atraso) + .4s + var(--n) * .11s)}
@keyframes ibPonto{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.ib-ponto{transform-box:fill-box;transform-origin:center}
.ib-valor{opacity:0;animation:ibSobe .4s ease forwards;animation-delay:calc(var(--atraso) + 1.1s)}
.ib-texto{font-size:12.5px;line-height:1.5;color:var(--txt)}
.ib-texto b{display:block;font-size:13px;margin-bottom:2px}
.ib-texto p{margin:0;color:var(--txt-2)}
.ib-eixo{position:relative;height:30px;border-top:2px solid var(--linha);margin-top:2px}
.ib-eixo span{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap;
  font-size:11.5px;font-weight:650;color:var(--txt-2)}
.ib-eixo span:first-child{transform:none}
.ib-eixo span:last-child{transform:translateX(-100%)}
.ib-rodape{background:#F6F8FB;border-top:1px solid var(--linha);padding:13px 26px;
  font-size:11.5px;color:var(--txt-2);text-align:center}
@media(max-width:1100px){
  .ib-cab{grid-template-columns:repeat(4,1fr)}
  .ib-linha,.ib-datas{grid-template-columns:180px 1fr;gap:12px}
  .ib-texto{grid-column:1/-1;border-top:1px dashed var(--linha);padding-top:8px}
  .ib-datas .ib-texto{display:none}
}
@media(max-width:640px){
  .ib-cab{grid-template-columns:repeat(2,1fr)}
  .ib-linha,.ib-datas{grid-template-columns:1fr}
  .ib-corpo{padding:6px 16px}
}
@media(prefers-reduced-motion:reduce){
  .ib-linha,.ib-datas,.ib-ponto,.ib-valor{animation:none;opacity:1;transform:none}
  .ib-traco{animation:none;stroke-dashoffset:0}
  .ib-pagina,.ib-show{transition:none}
}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .22s,opacity .22s;z-index:90;max-width:90vw;
  opacity:0;visibility:hidden;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}

@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto;display:flex;gap:8px;overflow-x:auto;padding:10px}
  .marca{display:none}
  nav{display:flex;gap:6px}
  nav button{width:auto;white-space:nowrap;padding:8px 13px}
  main{padding:16px 14px 50px}
  .g2,.g4{grid-template-columns:1fr}
  .caderno .cab{grid-template-columns:1fr}
  table{font-size:13px}
  th,td{padding:8px 6px}
}
@media print{
  aside,.abas,.topo .dir,.modal-pe,.btn{display:none!important}
  body{background:#fff}#app{grid-template-columns:1fr}
  .modal{position:static;background:none;padding:0}
  .modal-box{max-width:100%;box-shadow:none}
  /* o olho embaça na tela, mas no papel ele quer o número */
  .sigiloso{filter:none!important}
}

/* Imprimir a apresentação do InBody: só a folha, deitada, sem a animação —
   é o que vira PDF para o paciente levar. */
@media print{
  body.apresentando > *{display:none!important}
  body.apresentando > .ib-show{display:block!important;position:static;padding:0;
    background:none;backdrop-filter:none;-webkit-backdrop-filter:none;opacity:1;overflow:visible}
  body.apresentando .ib-sair,body.apresentando .ib-imprimir{display:none!important}
  body.apresentando .ib-pagina{width:100%;max-width:none;box-shadow:none;border-radius:0;
    transform:none!important}
  body.apresentando .ib-traco{stroke-dasharray:none!important;stroke-dashoffset:0!important;
    animation:none!important}
  body.apresentando .ib-ponto,body.apresentando .ib-valor,
  body.apresentando .ib-linha,body.apresentando .ib-datas{animation:none!important;
    opacity:1!important;transform:none!important}
  body.apresentando .ib-linha{break-inside:avoid;page-break-inside:avoid}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="login-box">
    <div class="logo"><img src="/img/logo.png" alt="Luca Ternes" width="26" height="48"></div>
    <h2 style="text-align:center">CRM Luca Ternes</h2>
    <p style="text-align:center;color:var(--txt-2);font-size:13px;margin:0 0 18px">Consultorias · Brasil e Estados Unidos</p>
    <div id="setupAviso" class="hide" style="background:#FBF0D6;color:#8A6D12;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:14px">
      Primeiro acesso: crie o usuário administrador.
    </div>
    <div style="margin-bottom:10px" id="wrapNome" class="hide">
      <label>Nome</label><input id="inNome" placeholder="Luca Ternes">
    </div>
    <div style="margin-bottom:10px">
      <label>E-mail</label><input id="inEmail" type="email" autocomplete="username">
    </div>
    <div style="margin-bottom:16px">
      <label>Senha</label><input id="inSenha" type="password" autocomplete="current-password">
    </div>
    <button class="btn" style="width:100%" id="btnEntrar">Entrar</button>
    <p id="loginErro" style="color:var(--erro);font-size:13px;text-align:center;margin:12px 0 0"></p>
  </div>
</section>

<!-- APP -->
<div id="app" class="hide">
  <aside>
    <div class="marca">
      <div><img src="/img/logo.png" alt="" width="18" height="34"></div>
      <div><b>Luca Ternes</b><span>CRM de consultorias</span></div>
    </div>
    <nav id="nav">
      <button data-tela="home" class="on">Início <span class="bd hide" id="bdHome"></span></button>
      <button data-tela="funil">Funil <span class="bd hide" id="bdFunil"></span></button>
      <button data-tela="pacientes">Pacientes</button>
      <button data-tela="agenda">Agenda</button>
      <button data-tela="financeiro">Financeiro</button>
      <button data-tela="whatsapp">WhatsApp <span class="bd hide" id="bdWa"></span></button>
      <button data-tela="planos">Planos</button>
      <button data-tela="conversores">Conversores</button>
      <button data-tela="config">Configurações</button>
    </nav>
    <button class="btn ghost mini" id="olho" style="margin-top:14px;width:100%"
            title="Ocultar os valores da tela">👁 Ocultar valores</button>
    <button class="btn ghost mini" id="btnSair" style="margin-top:8px;width:100%">Sair</button>
  </aside>
  <main>
    <div id="avisoBanco" class="aviso-banco hide"></div>
    <div id="tela"></div>
  </main>
</div>

<div id="tarefas" class="hide">
  <div class="tf-cab" id="tfCabecalho">
    <b>Tarefas</b>
    <small id="tfContador"></small>
    <button type="button" id="tfMin" title="Minimizar / abrir">▾</button>
  </div>
  <div class="tf-nova">
    <input type="text" id="tfNova" placeholder="o que não pode esquecer" autocomplete="off">
    <button type="button" id="tfQuando" title="Marcar dia e hora">🕐</button>
    <button type="button" id="tfAdd" title="Adicionar">+</button>
  </div>
  <div id="tfQuandoCampos" class="hide">
    <input type="date" id="tfData"><input type="time" id="tfHora">
  </div>
  <div class="tf-corpo">
    <ul id="tfLista"></ul>
    <button type="button" id="tfPorData" class="hide" onclick="ordenarTarefasPorData()"
            title="Voltar para a ordem da agenda">↕ Ordenar por data</button>
    <div class="tf-feitas-cab hide" id="tfFeitasCab" onclick="alternarFeitas()">
      <span class="seta" id="tfFeitasSeta">▸</span> Concluídas
      <span class="qtd" id="tfFeitasQtd">0</span>
    </div>
    <ul id="tfFeitas" class="hide"></ul>
    <button type="button" id="tfLimpar" class="hide" onclick="limparFeitas()">Apagar as concluídas</button>
  </div>
</div>

<div id="toast"></div>
<script src="/app.js?v=1"></script>
</body>
</html>
